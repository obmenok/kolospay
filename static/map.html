        // --- ЦЕНТРИРОВАНИЕ ---
        function alignMap() {
            map.fitBounds(bounds);
            // Тут можно добавить логику отступов, если нужно, 
            // но fitBounds работает наиболее стабильно и предсказуемо.
            // map.setMinZoom(map.getBoundsZoom(bounds));
        }

        alignMap();
        window.addEventListener('resize', function() { setTimeout(alignMap, 300); });

        var myRenderer = L.canvas({ padding: 0.5 });
        var layersById = {};

        plots.forEach(function(plot) {
            var poly = L.polygon(plot.coords, {
                renderer: myRenderer, color: 'transparent', fillColor: 'transparent', fillOpacity: 0.0, weight: 1
            }).addTo(map);

            layersById[plot.label] = poly;

            var content = `
                <div class="popup-header">Участок №${plot.label}</div>
                <div class="popup-row">
                    <span class="popup-label">Кадастровый №:</span>
                    <span class="popup-value">${plot.info.cadastral}</span>
                </div>
                <div class="popup-row">
                    <span class="popup-label">Площадь:</span>
                    <span class="popup-value">${plot.info.area}</span>
                </div>
            `;
            poly.bindPopup(content);

            poly.on('mouseover', function(e) {
                e.target.setStyle({ color: '#007bff', weight: 3, fillColor: '#007bff', fillOpacity: 0.15 });
            });
            poly.on('mouseout', function(e) {
                e.target.setStyle({ color: 'transparent', weight: 1, fillColor: 'transparent', fillOpacity: 0.0 });
            });
        });

        function findPlot() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            var target = layersById[query];
            if (target) {
                map.flyToBounds(target.getBounds(), { padding: [100, 100], duration: 1.5 });
                setTimeout(() => target.openPopup(), 1500);
            } else { alert('Участок №' + query + ' не найден!'); }
        }

        function handleEnter(e) { if (e.key === 'Enter') findPlot(); }
    </script>
